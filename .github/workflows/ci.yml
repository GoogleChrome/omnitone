name: ci
on: [push, pull_request]

# Least privilege: this workflow only reads the repo, it never writes back.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a tag, because a tag can
      # be moved to point at different code after review.
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eslint
      - run: npm run build
      - name: Verify build/ is up to date
        run: git diff --exit-code -- build/
      # ubuntu-latest ships Google Chrome preinstalled, which the Web Audio
      # test suite launches via @web/test-runner's Chrome launcher.
      - run: npm test
