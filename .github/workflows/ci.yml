name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eslint
      - run: npm run build
      - name: Verify build/ is up to date
        run: git diff --exit-code -- build/
      # ubuntu-latest ships Google Chrome preinstalled, which the Web Audio
      # test suite launches via @web/test-runner's Chrome launcher.
      - run: npm test
