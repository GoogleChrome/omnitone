name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eslint
      - run: npm run build
      - name: Verify build/ is up to date
        run: git diff --exit-code -- build/
      - run: npx playwright install --with-deps chromium
      - run: npm test
